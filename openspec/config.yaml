schema: spec-driven

context: |
  GeneoGraph is a static browser prototype in src/ with seeded sample data, in-memory project state, English/Russian UI, and no build step or backend. Product_Vision.md describes direction, not necessarily current behavior.
  Read AGENTS.md for repository conventions and Prototype_Design_Document.md for the current design and engineering guide. Verify claims against code before adding durable specs.
  Keep main specs to verified current behavior and proposed work in focused change folders. Inspect only relevant files with targeted searches; avoid repeated reads and unrelated refactors. Prefer surgical patches.
  Scope verification to change risk: run focused tests before broader suites, and do not add tests for every minor change. Stop when acceptance criteria pass; keep summaries concise and omit large diffs. Run git diff --check.